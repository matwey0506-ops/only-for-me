<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>TriXXDe — Music for friends</title>
<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<!-- FontAwesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        trixx: {
          bg: '#0B0912',
          card: '#151020',
          primary: '#A879FF',
          secondary: '#7055DC',
          light: '#C5A5FF',
          text: '#FFFFFF',
          muted: '#AAA4B8'
        }
      },
      fontFamily: {
        sans: ['Plus Jakarta Sans', 'sans-serif'],
        m3: ['Roboto', 'sans-serif']
      }
    }
  }
}
</script>
<!-- Liquid Glass & Material 3 Expressive Custom CSS -->
<style>
:root {
  --glass-bg: rgba(21, 16, 32, 0.55);
  --glass-border: rgba(197, 165, 255, 0.15);
  --glass-glow: rgba(168, 121, 255, 0.25);
  --trixx-primary: #A879FF;
  --trixx-secondary: #7055DC;
  --md-sys-motion-easing-expressive: cubic-bezier(0.32, 0.72, 0, 1);
  --md-sys-motion-easing-standard: cubic-bezier(0.2, 0, 0, 1);
}

body {
  background-color: #0B0912;
  color: #FFFFFF;
  font-family: 'Plus Jakarta Sans', sans-serif;
  overflow-x: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.ambient-glow {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.glow-orb-1 {
  position: absolute;
  top: -10%;
  left: -10%;
  width: 50vw;
  height: 50vw;
  background: radial-gradient(circle, rgba(168, 121, 255, 0.18) 0%, rgba(0,0,0,0) 70%);
  filter: blur(80px);
  animation: pulseGlow 12s infinite alternate ease-in-out;
}
.glow-orb-2 {
  position: absolute;
  bottom: -10%;
  right: -10%;
  width: 60vw;
  height: 60vw;
  background: radial-gradient(circle, rgba(112, 85, 220, 0.22) 0%, rgba(0,0,0,0) 70%);
  filter: blur(100px);
  animation: pulseGlow 15s infinite alternate-reverse ease-in-out;
}

@keyframes pulseGlow {
  0% { transform: scale(1) translate(0, 0); }
  100% { transform: scale(1.15) translate(40px, 30px); }
}

.liquid-glass {
  background: var(--glass-bg);
  backdrop-filter: blur(28px) saturate(140%);
  -webkit-backdrop-filter: blur(28px) saturate(140%);
  border: 1px solid var(--glass-border);
  box-shadow: 
    inset 0 1px 1px 0 rgba(255, 255, 255, 0.15),
    0 12px 32px 0 rgba(0, 0, 0, 0.37);
}

.liquid-glass-card {
  background: rgba(25, 18, 38, 0.45);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 24px;
  transition: transform 0.4s var(--md-sys-motion-easing-expressive),
              background 0.3s ease,
              box-shadow 0.4s var(--md-sys-motion-easing-expressive),
              border-color 0.3s ease;
}

.liquid-glass-card:hover {
  background: rgba(45, 30, 70, 0.65);
  border-color: rgba(168, 121, 255, 0.5);
  transform: translateY(-6px) scale(1.02);
  box-shadow: 0 18px 36px -6px rgba(168, 121, 255, 0.4);
}

.liquid-glass-card:active {
  transform: scale(0.96);
}

.liquid-glass-input {
  background: rgba(15, 11, 24, 0.6);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(197, 165, 255, 0.2);
  transition: all 0.35s var(--md-sys-motion-easing-expressive);
}

.liquid-glass-input:focus {
  border-color: var(--trixx-primary);
  box-shadow: 0 0 24px rgba(168, 121, 255, 0.45);
  outline: none;
  transform: scale(1.01);
}

.btn-trixx {
  background: linear-gradient(135deg, #A879FF 0%, #7055DC 100%);
  box-shadow: 0 4px 18px rgba(168, 121, 255, 0.35);
  transition: transform 0.35s var(--md-sys-motion-easing-expressive),
              box-shadow 0.35s var(--md-sys-motion-easing-expressive),
              filter 0.2s ease;
  border-radius: 9999px;
  position: relative;
  overflow: hidden;
}

.btn-trixx:hover {
  transform: scale(1.07);
  box-shadow: 0 10px 32px rgba(168, 121, 255, 0.65);
  filter: brightness(1.1);
}

.btn-trixx:active {
  transform: scale(0.92);
}

.btn-icon-expressive {
  transition: transform 0.3s var(--md-sys-motion-easing-expressive),
              color 0.2s ease;
}

.btn-icon-expressive:hover {
  transform: scale(1.2);
}

.btn-icon-expressive:active {
  transform: scale(0.85);
}

.page-transition {
  animation: viewFadeIn 0.45s var(--md-sys-motion-easing-expressive) forwards;
}

@keyframes viewFadeIn {
  0% {
    opacity: 0;
    transform: translateY(20px) scale(0.97);
    filter: blur(8px);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
    filter: blur(0px);
  }
}

#fullscreen-player {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: rgba(11, 9, 18, 0.88);
  backdrop-filter: blur(40px) saturate(180%);
  -webkit-backdrop-filter: blur(40px) saturate(180%);
  transition: transform 0.6s var(--md-sys-motion-easing-expressive),
              opacity 0.4s ease;
  transform: translateY(100%) scale(0.92);
  opacity: 0;
  pointer-events: none;
}

#fullscreen-player.active {
  transform: translateY(0) scale(1);
  opacity: 1;
  pointer-events: auto;
}

.heart-active {
  color: #A879FF !important;
  animation: heartBounce 0.45s var(--md-sys-motion-easing-expressive);
}

@keyframes heartBounce {
  0% { transform: scale(1); }
  40% { transform: scale(1.4); }
  70% { transform: scale(0.9); }
  100% { transform: scale(1); }
}

#toast-container {
  position: fixed;
  top: 24px;
  right: 24px;
  z-index: 9999;
  pointer-events: none;
}
.toast {
  pointer-events: auto;
  animation: slideInRight 0.45s var(--md-sys-motion-easing-expressive) forwards;
}
@keyframes slideInRight {
  from { opacity: 0; transform: translateX(60px) scale(0.9); }
  to { opacity: 1; transform: translateX(0) scale(1); }
}

.line-clamp-1 {
  display: -webkit-box;
  -webkit-line-clamp: 1;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

#auth-lock-overlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: rgba(11, 9, 18, 0.95);
  backdrop-filter: blur(40px) saturate(180%);
  -webkit-backdrop-filter: blur(40px) saturate(180%);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.4s var(--md-sys-motion-easing-expressive);
}

#auth-lock-overlay.hidden {
  display: none !important;
  pointer-events: none;
}
</style>
</head>
<body class="min-h-screen flex flex-col antialiased">

<!-- Ambient background glows -->
<div class="ambient-glow">
  <div class="glow-orb-1"></div>
  <div class="glow-orb-2"></div>
</div>

<!-- HARD AUTH LOCK OVERLAY SCREEN -->
<div id="auth-lock-overlay" class="p-4">
  <div class="liquid-glass border border-trixx-primary/40 w-full max-w-md rounded-3xl p-6 sm:p-8 relative shadow-2xl space-y-6 text-center">
    <div class="w-16 h-16 rounded-3xl bg-gradient-to-tr from-trixx-primary to-trixx-secondary flex items-center justify-center mx-auto shadow-xl shadow-trixx-primary/40 animate-pulse">
      <i class="fa-solid fa-compact-disc text-3xl text-white"></i>
    </div>
    <div>
      <h2 class="text-3xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-white via-purple-200 to-trixx-light">TriXXDe</h2>
      <p class="text-xs text-trixx-muted mt-1 font-semibold uppercase tracking-widest">Music for friends</p>
      <div class="mt-4 p-3 rounded-2xl bg-white/5 border border-white/10 text-xs text-purple-200">
        <i class="fa-solid fa-user-group text-trixx-primary mr-1"></i> Доступ открыт только для друзей по Инвайт-коду.
      </div>
    </div>

    <form id="lock-auth-form" onsubmit="handleLockAuthSubmit(event)" class="space-y-4 text-left">
      <div id="lock-invite-container" class="space-y-1">
        <label class="text-xs font-semibold text-trixx-muted">Инвайт-код доступа</label>
        <input type="text" id="lock-invite-code" placeholder="Например: TRIXX-FRIENDS-2026" class="w-full px-4 py-3 rounded-xl liquid-glass-input text-white text-sm uppercase tracking-wider font-mono">
      </div>
      <div id="lock-username-container" class="space-y-1 hidden">
        <label class="text-xs font-semibold text-trixx-muted">Имя пользователя</label>
        <input type="text" id="lock-username" placeholder="Alex" class="w-full px-4 py-3 rounded-xl liquid-glass-input text-white text-sm">
      </div>
      <div class="space-y-1">
        <label class="text-xs font-semibold text-trixx-muted">Email</label>
        <input type="email" id="lock-email" required placeholder="name@example.com" class="w-full px-4 py-3 rounded-xl liquid-glass-input text-white text-sm">
      </div>
      <div class="space-y-1">
        <label class="text-xs font-semibold text-trixx-muted">Пароль</label>
        <input type="password" id="lock-password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl liquid-glass-input text-white text-sm">
      </div>

      <button type="submit" id="lock-auth-submit-btn" class="w-full py-3.5 rounded-xl btn-trixx font-bold text-sm text-white shadow-lg">
        Войти в TriXXDe
      </button>
    </form>

    <div class="text-center text-xs pt-2 border-t border-white/10">
      <span id="lock-auth-toggle-text" class="text-trixx-muted">Ещё нет аккаунта?</span>
      <button onclick="toggleLockAuthMode()" id="lock-auth-toggle-btn" class="text-trixx-primary font-bold ml-1 hover:underline">Зарегистрироваться</button>
    </div>
  </div>
</div>

<!-- Notification Toast System -->
<div id="toast-container" class="space-y-3"></div>

<!-- MAIN APP WRAPPER -->
<div id="app" class="relative z-10 flex flex-col flex-1 h-screen overflow-hidden">

  <!-- HEADER BAR -->
  <header class="h-16 px-4 md:px-8 flex items-center justify-between border-b border-white/10 liquid-glass z-30 shrink-0">
    <div class="flex items-center gap-3 cursor-pointer" onclick="navigate('home')">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-[#A879FF] to-[#7055DC] flex items-center justify-center shadow-lg shadow-[#A879FF]/30">
        <i class="fa-solid fa-compact-disc text-xl text-white"></i>
      </div>
      <div>
        <h1 class="font-extrabold text-xl tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-white via-purple-200 to-[#A879FF]">
          TriXXDe
        </h1>
        <p class="text-[10px] text-trixx-muted tracking-widest font-semibold uppercase -mt-1">Music for friends</p>
      </div>
    </div>

    <!-- Profile Badge -->
    <div class="flex items-center gap-3">
      <div id="user-profile-badge" class="flex items-center gap-2 cursor-pointer p-1.5 rounded-full hover:bg-white/10 transition-all" onclick="handleUserBadgeClick()">
        <div class="w-9 h-9 rounded-full bg-purple-900/50 border border-trixx-light/30 flex items-center justify-center text-trixx-light overflow-hidden">
          <i id="user-avatar-icon" class="fa-solid fa-user text-sm"></i>
        </div>
        <span id="user-display-name" class="text-xs font-medium text-purple-200 pr-2">Войти</span>
      </div>
    </div>
  </header>

  <!-- BODY CONTENT AREA -->
  <div class="flex flex-1 overflow-hidden relative">
    <!-- Sidebar Navigation (Desktop) -->
    <aside class="hidden md:flex flex-col w-64 border-r border-white/10 liquid-glass p-4 gap-6 shrink-0 z-20">
      <nav class="space-y-2">
        <button onclick="navigate('home')" id="nav-home" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm text-trixx-muted hover:text-white hover:bg-white/5 transition-all">
          <i class="fa-solid fa-house text-lg w-5"></i>
          <span>Главная</span>
        </button>
        <button onclick="navigate('search')" id="nav-search" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm text-trixx-muted hover:text-white hover:bg-white/5 transition-all">
          <i class="fa-solid fa-magnifying-glass text-lg w-5"></i>
          <span>Поиск</span>
        </button>
        <button onclick="requireAuth(() => navigate('library'))" id="nav-library" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm text-trixx-muted hover:text-white hover:bg-white/5 transition-all">
          <i class="fa-solid fa-book-bookmark text-lg w-5"></i>
          <span>Моя Медиатека</span>
        </button>
        <button onclick="requireAuth(() => navigate('settings'))" id="nav-settings" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm text-trixx-muted hover:text-white hover:bg-white/5 transition-all">
          <i class="fa-solid fa-gear text-lg w-5"></i>
          <span>Настройки</span>
        </button>
        <!-- Admin Panel Button -->
        <button onclick="requireAuth(() => navigate('admin'))" id="nav-admin" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm text-trixx-primary hover:bg-trixx-primary/10 transition-all hidden">
          <i class="fa-solid fa-shield-halved text-lg w-5"></i>
          <span>Админ-панель</span>
        </button>
      </nav>

      <div class="border-t border-white/10 pt-4 flex-1 overflow-y-auto">
        <div class="flex items-center justify-between mb-3 px-2">
          <span class="text-xs font-semibold uppercase text-trixx-muted tracking-wider">Плейлисты</span>
          <button onclick="requireAuth(promptCreatePlaylist)" class="text-trixx-primary hover:text-trixx-light text-xs font-bold flex items-center gap-1">
            <i class="fa-solid fa-plus"></i> Создать
          </button>
        </div>
        <div id="sidebar-playlists-list" class="space-y-1">
          <div class="text-xs text-trixx-muted p-2 italic">Плейлистов пока нет</div>
        </div>
      </div>
    </aside>

    <!-- Dynamic View Area -->
    <main id="main-view" class="flex-1 overflow-y-auto p-4 md:p-8 pb-32 md:pb-28">
      <!-- Views render here -->
    </main>
  </div>

  <!-- Mobile Bottom Nav -->
  <div class="md:hidden fixed bottom-16 left-0 right-0 z-30 liquid-glass border-t border-white/10 flex justify-around py-2 px-1">
    <button onclick="navigate('home')" class="mobile-nav-btn flex flex-col items-center gap-1 text-trixx-muted p-2 text-xs" id="mobile-nav-home">
      <i class="fa-solid fa-house text-lg"></i>
      <span>Главная</span>
    </button>
    <button onclick="navigate('search')" class="mobile-nav-btn flex flex-col items-center gap-1 text-trixx-muted p-2 text-xs" id="mobile-nav-search">
      <i class="fa-solid fa-magnifying-glass text-lg"></i>
      <span>Поиск</span>
    </button>
    <button onclick="requireAuth(() => navigate('library'))" class="mobile-nav-btn flex flex-col items-center gap-1 text-trixx-muted p-2 text-xs" id="mobile-nav-library">
      <i class="fa-solid fa-book-bookmark text-lg"></i>
      <span>Медиатека</span>
    </button>
    <button onclick="requireAuth(() => navigate('settings'))" class="mobile-nav-btn flex flex-col items-center gap-1 text-trixx-muted p-2 text-xs" id="mobile-nav-settings">
      <i class="fa-solid fa-gear text-lg"></i>
      <span>Настройки</span>
    </button>
    <button onclick="requireAuth(() => navigate('admin'))" class="mobile-nav-btn flex flex-col items-center gap-1 text-trixx-primary p-2 text-xs hidden" id="mobile-nav-admin">
      <i class="fa-solid fa-shield-halved text-lg"></i>
      <span>Админ</span>
    </button>
  </div>

  <!-- MINI PLAYER -->
  <footer id="mini-player" class="fixed bottom-0 left-0 right-0 h-16 md:h-20 liquid-glass border-t border-white/10 px-4 flex items-center justify-between z-40 transition-transform duration-300">
    <div class="flex items-center gap-3 w-1/3 min-w-0 cursor-pointer group" onclick="toggleFullscreenPlayer(true)">
      <div class="w-10 h-10 md:w-12 md:h-12 rounded-lg bg-purple-950 overflow-hidden relative shrink-0 border border-white/10 shadow-md">
        <img id="player-track-art" src="https://placehold.co/100x100/151020/A879FF?text=TriXXDe" class="w-full h-full object-cover" alt="Art">
      </div>
      <div class="min-w-0 flex-1">
        <h4 id="player-track-title" class="font-semibold text-xs md:text-sm text-white truncate line-clamp-1">Нет трека</h4>
        <p id="player-track-artist" class="text-[11px] md:text-xs text-trixx-muted truncate line-clamp-1">Выберите трек для старта</p>
      </div>
    </div>

    <div class="flex flex-col items-center justify-center w-1/3 max-w-xl px-2">
      <div class="flex items-center gap-3 md:gap-6 mb-1">
        <button onclick="playPrevTrack()" class="btn-icon-expressive text-trixx-muted hover:text-white text-sm md:text-base">
          <i class="fa-solid fa-backward-step"></i>
        </button>
        <button onclick="togglePlayPause()" id="player-play-btn" class="w-9 h-9 md:w-11 md:h-11 rounded-full btn-trixx flex items-center justify-center text-white text-sm md:text-base">
          <i class="fa-solid fa-play ml-0.5"></i>
        </button>
        <button onclick="playNextTrack()" class="btn-icon-expressive text-trixx-muted hover:text-white text-sm md:text-base">
          <i class="fa-solid fa-forward-step"></i>
        </button>
      </div>

      <div class="w-full flex items-center gap-2 text-[10px] text-trixx-muted font-mono">
        <span id="player-current-time">0:00</span>
        <div class="flex-1 relative h-1.5 bg-white/10 rounded-full overflow-hidden cursor-pointer" onclick="seekTrack(event)">
          <div id="player-progress-bar" class="h-full bg-gradient-to-r from-trixx-secondary to-trixx-primary w-0 rounded-full"></div>
        </div>
        <span id="player-duration">0:00</span>
      </div>
    </div>

    <div class="flex items-center justify-end gap-3 w-1/3 shrink-0">
      <button onclick="toggleFullscreenPlayer(true)" class="btn-icon-expressive p-2 text-trixx-muted hover:text-white">
        <i class="fa-solid fa-expand text-sm"></i>
      </button>
    </div>
  </footer>
</div>

<!-- FULLSCREEN PLAYER MODAL -->
<div id="fullscreen-player" class="flex flex-col p-6 md:p-12 overflow-y-auto">
  <div class="flex items-center justify-between mb-6 max-w-5xl mx-auto w-full">
    <button onclick="toggleFullscreenPlayer(false)" class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center text-white hover:bg-white/20 transition-all btn-icon-expressive">
      <i class="fa-solid fa-chevron-down text-lg"></i>
    </button>
    <span class="text-xs font-bold uppercase tracking-widest text-trixx-muted">Сейчас играет</span>
    <div></div>
  </div>

  <div class="flex-1 flex flex-col md:flex-row items-center justify-center gap-8 max-w-5xl mx-auto w-full my-auto">
    <div class="relative w-64 h-64 sm:w-80 sm:h-80 md:w-96 md:h-96 shrink-0">
      <img id="fs-art" src="https://placehold.co/400x400/151020/A879FF?text=TriXXDe" class="w-full h-full object-cover rounded-3xl border border-white/20 shadow-2xl" alt="Art">
    </div>

    <div class="flex flex-col flex-1 w-full max-w-md justify-center space-y-6">
      <div>
        <h2 id="fs-title" class="text-2xl md:text-3xl font-extrabold text-white truncate">Нет трека</h2>
        <p id="fs-artist" class="text-base text-trixx-muted mt-1 font-medium">Секция воспроизведения</p>
      </div>

      <div class="space-y-1">
        <div class="w-full relative h-2 bg-white/10 rounded-full overflow-hidden cursor-pointer" onclick="seekTrack(event)">
          <div id="fs-progress-bar" class="h-full bg-gradient-to-r from-trixx-secondary to-trixx-primary w-0 rounded-full"></div>
        </div>
        <div class="flex justify-between text-xs font-mono text-trixx-muted">
          <span id="fs-current-time">0:00</span>
          <span id="fs-duration">0:00</span>
        </div>
      </div>

      <div class="flex items-center justify-center gap-6 pt-2">
        <button onclick="playPrevTrack()" class="btn-icon-expressive text-white hover:text-trixx-light text-2xl">
          <i class="fa-solid fa-backward-step"></i>
        </button>
        <button onclick="togglePlayPause()" id="fs-play-btn" class="w-16 h-16 rounded-full btn-trixx flex items-center justify-center text-white text-2xl shadow-xl shadow-trixx-primary/40">
          <i class="fa-solid fa-play ml-1"></i>
        </button>
        <button onclick="playNextTrack()" class="btn-icon-expressive text-white hover:text-trixx-light text-2xl">
          <i class="fa-solid fa-forward-step"></i>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- AUDIO ENGINE -->
<!-- HIDDEN YOUTUBE PLAYER (звук идёт отсюда, картинка скрыта) -->
<div id="yt-player-wrap" aria-hidden="true" style="position:fixed;right:0;bottom:0;width:200px;height:200px;opacity:0;pointer-events:none;z-index:-1;overflow:hidden;">
  <div id="yt-player"></div>
</div>

<!-- FIREBASE SDKs -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";

/* ===================== API (Flask + ytmusicapi) ===================== */
const API_BASE = 'http://127.0.0.1:5000';
const PLACEHOLDER_ART = 'https://placehold.co/300x300/151020/A879FF?text=TriXXDe';
const HOME_QUERIES = ['Хиты 2026', 'Top hits', 'Lo-fi chill', 'Русский рэп', 'Rock classics', 'Electronic dance', 'Indie pop'];

function esc(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function apiSearch(query) {
  const res = await fetch(`${API_BASE}/search?q=${encodeURIComponent(query)}`);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const list = await res.json();
  return list.map(t => ({
    id: t.id,
    title: t.title,
    artist: t.artist,
    artwork: t.cover || PLACEHOLDER_ART
  }));
}

    return;

    const token = ++searchToken;
    resultsContainer.innerHTML = `<p class="text-xs text-trixx-muted text-center pt-8 animate-pulse">Поиск...</p>`;

    try {
      const tracks = await apiSearch(query);

            </div>

              <i class="fa-solid fa-play ml-0.5 text-xs"></i>

      } else {
        resultsContainer.innerHTML = `<p class="text-xs text-trixx-muted text-center pt-8">Ничего не найдено</p>`;
      }
    } catch (e) {
      if (token !== searchToken) return;
      resultsContainer.innerHTML = `<p class="text-xs text-trixx-muted text-center pt-8">Нет связи с сервером. Запустите <span class="font-mono text-trixx-light">server.py</span> (${API_BASE}).</p>`;

function playTrackFromId(trackId) {
  const track = window.state.tracksMap[trackId];
  if (!track) return;

  // очередь = список, который сейчас открыт на экране (главная / поиск / медиатека)
  const view = window.state.viewQueue || [];
  const idx = view.indexOf(trackId);
  window.state.queue = idx >= 0 ? view.slice() : [trackId];
  window.state.queueIndex = idx >= 0 ? idx : 0;

  playTrack(track, true);
}

function playTrack(track, openFullscreen) {
  window.state.currentTrack = track;
  window.state.isPlaying = true;
  resetProgressUI();
  updatePlayerUI();
  updateMediaSessionMetadata(track);
  if (openFullscreen) toggleFullscreenPlayer(true);
  loadVideo(track.id);
}

function togglePlayPause() {
  if (!window.state.currentTrack || !ytReady) return;
  const s = ytPlayer.getPlayerState();
  if (s === YT.PlayerState.PLAYING || s === YT.PlayerState.BUFFERING) ytPlayer.pauseVideo();
  else ytPlayer.playVideo();
}

/* MEDIA SESSION API INTEGRATION */
function updateMediaSessionMetadata(track) {
  if (!('mediaSession' in navigator)) return;

  const artUrl = track.artwork || 'https://placehold.co/512x512/151020/A879FF?text=TriXXDe';

  navigator.mediaSession.metadata = new MediaMetadata({
    title: track.title || 'Неизвестный трек',
    artist: track.artist || 'Неизвестный исполнитель',
    album: 'TriXXDe Streaming',
    artwork: [
      { src: artUrl, sizes: '96x96', type: 'image/jpeg' },
      { src: artUrl, sizes: '128x128', type: 'image/jpeg' },
      { src: artUrl, sizes: '192x192', type: 'image/jpeg' },
      { src: artUrl, sizes: '256x256', type: 'image/jpeg' },
      { src: artUrl, sizes: '384x384', type: 'image/jpeg' },
      { src: artUrl, sizes: '512x512', type: 'image/jpeg' }
    ]
  });

  updateMediaSessionPlaybackState();
}

function updateMediaSessionPlaybackState() {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.playbackState = window.state.isPlaying ? 'playing' : 'paused';
}

function updateMediaSessionPositionState() {
  if (!('mediaSession' in navigator) || !('setPositionState' in navigator.mediaSession)) return;
  if (!ytReady || !window.state.currentTrack) return;
  try {
    const dur = ytPlayer.getDuration();
    if (dur > 0) {
      navigator.mediaSession.setPositionState({
        duration: dur,
        playbackRate: 1,
        position: Math.min(ytPlayer.getCurrentTime(), dur)
      });
    }
  } catch (e) {}
}

function setupMediaSessionHandlers() {
  if (!('mediaSession' in navigator)) return;

  const actionHandlers = [
    ['play', () => { if (ytReady) ytPlayer.playVideo(); }],
    ['pause', () => { if (ytReady) ytPlayer.pauseVideo(); }],
    ['previoustrack', () => playPrevTrack()],
    ['nexttrack', () => playNextTrack()],
    ['seekto', (d) => {
      if (ytReady && d.seekTime !== undefined) { ytPlayer.seekTo(d.seekTime, true); updateMediaSessionPositionState(); }
    }],
    ['seekbackward', (d) => {
      if (ytReady) { ytPlayer.seekTo(Math.max(ytPlayer.getCurrentTime() - (d.seekOffset || 10), 0), true); }
    }],
    ['seekforward', (d) => {
      if (ytReady) { ytPlayer.seekTo(Math.min(ytPlayer.getCurrentTime() + (d.seekOffset || 10), ytPlayer.getDuration() || 0), true); }
    }]
  ];

  for (const [action, handler] of actionHandlers) {
    try { navigator.mediaSession.setActionHandler(action, handler); } catch (error) {}
  }
}

function toggleFullscreenPlayer(show) {
  const fs = document.getElementById('fullscreen-player');

}

let ytErrorStreak = 0;

function setupYouTubePlayer() {
  setInterval(tickProgress, 500);
  if (window.YT && window.YT.Player) { createYtPlayer(); return; }
  window.onYouTubeIframeAPIReady = createYtPlayer;
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  tag.onerror = () => showToast('Не удалось загрузить YouTube Player. Проверьте интернет.', 'error');
  document.head.appendChild(tag);
}

function createYtPlayer() {
  const vars = { autoplay: 1, controls: 0, disablekb: 1, fs: 0, rel: 0, playsinline: 1, modestbranding: 1 };
  if (location.protocol === 'http:' || location.protocol === 'https:') vars.origin = location.origin;
  ytPlayer = new YT.Player('yt-player', {
    width: '200',
    height: '200',
    playerVars: vars,
    events: {
      onReady: () => {
        ytReady = true;
        if (pendingVideoId) { ytPlayer.loadVideoById(pendingVideoId); pendingVideoId = null; }
      },
      onStateChange: onYtStateChange,
      onError: onYtError
    }
  });
}

function onYtStateChange(e) {
  const S = YT.PlayerState;
  if (e.data === S.ENDED) {
    window.state.isPlaying = false;
    updatePlayerUI();
    updateMediaSessionPlaybackState();
    stepQueue(1, true);
    return;
  }
  if (e.data === S.PLAYING) { window.state.isPlaying = true; ytErrorStreak = 0; }
  else if (e.data === S.PAUSED) { window.state.isPlaying = false; }
  else return;
  updatePlayerUI();
  updateMediaSessionPlaybackState();
}

function onYtError(e) {
  window.state.isPlaying = false;
  updatePlayerUI();
  updateMediaSessionPlaybackState();
  ytErrorStreak++;
  const q = window.state.queue || [];
  if (q.length > 1 && ytErrorStreak < q.length) {
    showToast('Трек недоступен для встроенного плеера, пропускаю', 'error');
    stepQueue(1, true);
  } else {
    showToast(`Ошибка воспроизведения (код ${e.data})`, 'error');
  }
}

function loadVideo(videoId) {
  if (ytReady) {
    ytPlayer.loadVideoById(videoId);
  } else {
    pendingVideoId = videoId;
    showToast('Плеер загружается...');
  }
}

function updateProgressUI(cur, dur) {
  const percent = dur > 0 ? Math.min((cur / dur) * 100, 100) : 0;
  document.getElementById('player-progress-bar').style.width = `${percent}%`;
  document.getElementById('fs-progress-bar').style.width = `${percent}%`;
  const c = formatTime(cur || 0), d = formatTime(dur || 0);
  document.getElementById('player-current-time').innerText = c;
  document.getElementById('fs-current-time').innerText = c;
  document.getElementById('player-duration').innerText = d;
  document.getElementById('fs-duration').innerText = d;
}

function resetProgressUI() { updateProgressUI(0, 0); }

function tickProgress() {
  if (!ytReady || !window.state.currentTrack) return;
  try {
    const dur = ytPlayer.getDuration();
    if (!dur) return;
    updateProgressUI(ytPlayer.getCurrentTime(), dur);
    updateMediaSessionPositionState();
  } catch (e) {}
}

function seekTrack(e) {
  if (!ytReady || !window.state.currentTrack) return;
  const dur = ytPlayer.getDuration();
  if (!dur) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const ratio = Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1);
  ytPlayer.seekTo(ratio * dur, true);
  updateProgressUI(ratio * dur, dur);
  updateMediaSessionPositionState();
}

function stepQueue(dir, auto = false) {
  const q = window.state.queue || [];
  if (!q.length) { showToast('Сначала выберите трек'); return; }
  if (auto && q.length === 1) return; // единственный трек закончился — просто стоп
  const i = (window.state.queueIndex + dir + q.length) % q.length;
  const track = window.state.tracksMap[q[i]];
  if (!track) return;
  window.state.queueIndex = i;
  playTrack(track, false);
}

function playNextTrack() { stepQueue(1); }

function playPrevTrack() {
  if (ytReady && window.state.currentTrack && ytPlayer.getCurrentTime() > 3) {
    ytPlayer.seekTo(0, true);
    return;
  }
  stepQueue(-1);
}
function promptCreatePlaylist() { prompt("Название нового плейлиста:"); }

function formatTime(seconds) {
  const mins = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);
  return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
}

function showToast(message, type = "info") {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast liquid-glass px-4 py-3 rounded-2xl flex items-center gap-3 text-xs font-semibold shadow-xl border ${type === 'error' ? 'border-red-500/40 text-red-200' : 'border-trixx-primary/40 text-white'}`;
  toast.innerHTML = `<i class="${type === 'error' ? 'fa-solid fa-circle-exclamation text-red-400' : 'fa-solid fa-circle-check text-trixx-primary'}"></i> <span>${message}</span>`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(50px)';
    toast.style.transition = 'all 0.3s ease';
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}
